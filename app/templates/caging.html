/* Ensure body does not allow horizontal scrolling */
/* Ensure body does not allow horizontal scrolling */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: white !important;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden; /* Prevents horizontal scrolling */
    width: 100%;
    min-height: 100vh; /* Ensure full height */
}
.container {
    width: 100%;
    min-height: 100vh; /* Ensure it takes full screen */
    background-color: white;
    padding: 20px;
    overflow-y: auto; /* Enable scrolling if content overflows */
    margin: 0;
}
.content-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    width: 100%;
}

/* Cards section on the left */
.grid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    width: 48%;
}


/* Card styling */
.card {
    text-align: center;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 4px 4px 15px rgba(0, 0, 0, 0.2);
    background-color: #fff;
    height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: all 0.3s ease-in-out;
}

.card:hover {
    box-shadow: 6px 6px 20px rgba(0, 0, 0, 0.3);
}

.card h1 {
    font-size: 16px;
    margin: 5px 0;
}

.card h2 {
    font-size: 18px;
    font-weight: 550;
    margin: 5px 0;
}

/* Chart on the right */
#chartDiv {
    width: 48%; /* Right side width */
    height: 300px;
    background-color: white;
    border-radius: 8px;
    border: 1px solid #ddd;
    padding: 10px;
}

/* Table styling */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    text-align: center;

}

/* Responsive adjustments */
@media (max-width: 768px) {
    .content-wrapper {
        flex-direction: column;
        align-items: center;
    }

    .grid-container, #chartDiv {
        width: 100%;
        max-width: 100%;
    }

    th, td {
        font-size: 12px;
        padding: 8px;
    }
}

    <script src="https://code.jscharting.com/latest/jscharting.js"></script>
    <script>
        var chart1 = JSC.chart("chartDiv", {
    title_label_text: "Cage Summary",
    legend_visible: false,
    defaultAxis_defaultTick_gridLine_width: 0,
    yAxis: [
        { 
            id: "a1", 
            scale_range_max: 300, 
            label_text: "Hours", // Left side label
            defaultTick_label_style_fontSize: 14
        },
        { 
            id: "a2", 
            orientation: "right", 
            scale_range: [0, 200], 
            defaultTick_label_text: "%value%",
            label_text: "% Expression", // Right side label
            defaultTick_label_style_fontSize: 14
        }
    ],
    xAxis: { 
        crosshair_enabled: true,
        label_text: "Cage" // Label below the chart
    },
    series: [
        {
            type: "column",
            yAxis: "a1",
            defaultPoint_tooltip: "<b>%yValue</b>",
            defaultPoint_color: "#4682b4",
            points: [
                ["01", 189], ["02", 210], ["03", 167], ["04", 177],
                ["05", 167], ["06", 189], ["07", 210], ["08", 167],
                ["09", 177], ["10", 167]
            ],
        },
        {
            type: "line",
            yAxis: "a2",
            defaultPoint_marker: { type: "circle", size: 5, outline_color: "white", outline_width: 1 },
            points: [
                ["01", 100], ["02", 111], ["03", 88], ["04", 93],
                ["05", 88], ["06", 100], ["07", 111], ["08", 88],
                ["09", 93], ["10", 88]
            ],
        },
    ],
});

        function createTable(data) {
            const container = document.getElementById("table-container");
            container.innerHTML = "";

            const table = document.createElement("table");
            table.classList.add("table", "table-striped", "table-bordered");

            const headers = [
                "Cage ID", "Start Date", "End Date", "Planned Hours",
                "Working Hours", "Active Hours", "Idle Hours", "Avg Workers/Day",
                "Work Progress", "Status"
            ];

            const headerRow = document.createElement("tr");
            headers.forEach((text) => {
                const th = document.createElement("th");
                th.textContent = text;
                th.style.textAlign = "center";
                th.style.padding = "10px";
                headerRow.appendChild(th);
            });
            table.appendChild(headerRow);

            data["Reinforcement Cage Preparation"].forEach((row) => {
                const tr = document.createElement("tr");
                row.forEach((text, index) => {
                    const td = document.createElement("td");
                    td.textContent = text;
                    td.style.textAlign = "center";
                    td.style.padding = "10px";

                    if (index === 9) {
                        if (text === "On Time") {
                            td.style.backgroundColor = "#9EF37D";
                        } else if (text.includes("delay")) {
                            td.style.backgroundColor = "#F16264";
                        } else if (text === "In Progress") {
                            td.style.backgroundColor = "#dddddd";
                        }
                    }

                    tr.appendChild(td);
                });
                table.appendChild(tr);
            });

            container.appendChild(table);
        }

        const tableData = {
            "Reinforcement Cage Preparation": [
                ["CAGE04", "2024-01-10", "2024-01-13", 189, 54, 51, 3, 6, "30%", "In Progress"],
                ["CAGE03", "2024-01-07", "2024-01-09", 189, 170, 167, 3, 6, "100%", "On Time"],
                ["CAGE02", "2024-01-04", "2024-01-07", 189, 218, 210, 8, 8, "100%", "21 hrs delay"],
                ["CAGE01", "2024-01-01", "2024-01-03", 189, 195, 189, 6, 7, "100%", "On Time"],
            ],
        };

        createTable(tableData);
    </script>
