function load_line_chart(selectedDate = null) {
    let apiUrl = "https://1dc1-60-243-70-152.ngrok-free.app/workforce/idle-data/";

    if (selectedDate) {
        apiUrl += `?idle_date=${selectedDate}`;
    }

    fetch(apiUrl, {
        headers: {
            "ngrok-skip-browser-warning": "true",
        },
    })
    .then((response) => {
        if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
        }
        return response.json();
    })
    .then((data) => {
        const chartData = [];
        const points = [];

        for (const time in data) {
            if (data.hasOwnProperty(time)) {
                const [
                    labour_count,
                    idle_status,
                    group_event,
                    date,
                    no_helmet,
                    image_url,
                ] = data[time];

                chartData.push({
                    x: time,
                    y: labour_count,
                    idle: idle_status,
                    group: group_event,
                    image: image_url,
                });

                let markerColor = "#4682b4"; // Default color
                let labelText = "";

                if (idle_status === "true" && group_event === "true") {
                    markerColor = "#D32F2F"; // Red for both
                    labelText = "Group Talking & Idle";
                } else if (idle_status === "true") {
                    markerColor = "#e89c0c"; // Orange for Idle
                    labelText = "Idle";
                } else if (group_event === "true") {
                    markerColor = "#00897B"; // Teal for Group Talking
                    labelText = "Group Talking";
                }

                if (labelText) {
                    points.push({
                        x: time,
                        y: labour_count,
                        marker: {
                            size: 5,
                            fillColor: markerColor,
                            strokeColor: markerColor,
                        },
                        label: {
                            borderColor: markerColor,
                            style: { color: "#fff", background: markerColor },
                            text: labelText,
                        },
                    });
                }
            }
        }

        // ✅ Pass the data to ApexCharts
        apex_lineChart("#workforce_chart", chartData, {
            // title: "Workforce Activity",
            annotations: { points: points },
        });
    })
    .catch((error) => {
        console.error("Error fetching data:", error);
    });
}

function apex_lineChart(querySelector = '', data = [], options = {}) {
    const data_series = [];
    const data_labels = [];

    for (const entry of data) {
        data_series.push({
            labour_count: entry.y,
            time: entry.x,
            idle: entry.idle,
            group: entry.group,
            playback_image: entry.image,
        });
        data_labels.push(entry.x);
    }

    const newOptions = {
        annotations: {
            yaxis: (options.annotations?.yaxis) || [],
            xaxis: (options.annotations?.xaxis) || [],
            points: (options.annotations?.points) || [],
        },
        chart: {
            height: 380,
            type: 'line',
            id: 'areachart-2',
        },
        dataLabels: {
            enabled: false,
        },
        stroke: {
            curve: 'smooth',
        },
        series: [
            {
                name: "Labour Count",
                data: data_series.map((item) => item.labour_count),
            },
        ],
        title: {
            text: options.title || '',
            align: 'left',
        },
        labels: data_labels,
        tooltip: {
            custom: function ({ dataPointIndex }) {
                const point = data_series[dataPointIndex];

                if (point.idle === "true" && point.group === "true") {
                    return `<div style="padding:10px;">
                        <strong>Time:</strong> ${point.time}<br />
                        <strong>Labour Count:</strong> ${point.labour_count}<br />
                        <strong>Status:</strong> Group Talking & Idle<br />
                        <img src="${point.playback_image}" alt="Event Image" style="width:300px;height:auto;" />
                    </div>`;
                } else if (point.idle === "true") {
                    return `<div style="padding:10px;">
                        <strong>Time:</strong> ${point.time}<br />
                        <strong>Labour Count:</strong> ${point.labour_count}<br />
                        <strong>Status:</strong> Idle<br />
                        <img src="${point.playback_image}" alt="Event Image" style="width:300px;height:auto;" />
                    </div>`;
                } else if (point.group === "true") {
                    return `<div style="padding:10px;">
                        <strong>Time:</strong> ${point.time}<br />
                        <strong>Labour Count:</strong> ${point.labour_count}<br />
                        <strong>Status:</strong> Group Talking<br />
                        <img src="${point.playback_image}" alt="Event Image" style="width:300px;height:auto;" />
                    </div>`;
                }

                return `<div style="padding:10px;">
                    <strong>Time:</strong> ${point.time}<br />
                    <strong>Labour Count:</strong> ${point.labour_count}<br />
                </div>`;
            },
        },
        xaxis: {
            categories: data_labels,
            tickAmount: 24,
            labels: {
                rotate: -45,
                format: 'yyyy-MM-dd',
            },
        },
        yaxis: {
            min: 0,
            max: Math.max(...data_series.map((item) => item.labour_count)) + 2,
            tickAmount: 4,
            labels: {
                formatter: function (val) {
                    return val ? val.toFixed(0) : 0;
                },
            },
        },
        colors: ['#4682b4'],
    };

    if (chart) {
        chart.updateOptions(newOptions);
        chart.updateSeries([{ data: data_series.map((item) => item.labour_count) }]);
    } else {
        chart = new ApexCharts(document.querySelector(querySelector), newOptions);
        chart.render();
    }
}


    function initializeDonutChart() {
        fetch('https://1dc1-60-243-70-152.ngrok-free.app/pie/')
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP error! Status: ${response.status}`);
      }
      return response.json();
    })
    .then(data => {
      if (Object.keys(data).length === 0) {
        console.error('No valid data received from API.');
        return;
      }

      // Extract values from JSON response
      const activeValue = parseFloat(data.Active.replace('%', '').trim()) || 0;
      const idleValue = parseFloat(data.Idle.replace('%', '').trim()) || 0;
      const groupValue = parseFloat(data.Group.replace('%', '').trim()) || 0;

      console.log("Pie Chart Data:", { activeValue, idleValue, groupValue });

      // If values are all 0, prevent empty chart
      if (activeValue === 0 && idleValue === 0 && groupValue === 0) {
        console.warn("Pie chart values are all zero, not rendering.");
        return;
      }

      // Prepare chart data
      const chartData = {
        ['Active (' + activeValue + '%)']: activeValue,
        ['Idle (' + idleValue + '%)']: idleValue,
        ['Group talking (' + groupValue + '%)']: groupValue,
      };

      // Render the ApexCharts donut chart
      var options = {
        series: [activeValue, idleValue, groupValue],
        chart: {
          type: 'donut',
          height: 350
        },
        labels: Object.keys(chartData),
        colors: ['#4682b4', '#e89c0c', '#00897B'],
        legend: {
          position: 'bottom',
        }
      };

      var chart = new ApexCharts(document.querySelector("#workforce_progress_chart"), options);
      chart.render();
    })
    .catch(error => {
      console.error('Error fetching or processing data:', error);
    });
}
